<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F3">
<title>Groots Cup</title>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Readex";font-weight:400;font-display:swap;src:url(fonts/readex-pro-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex";font-weight:500;font-display:swap;src:url(fonts/readex-pro-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex";font-weight:600;font-display:swap;src:url(fonts/readex-pro-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex";font-weight:700;font-display:swap;src:url(fonts/readex-pro-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex";font-weight:400;font-display:swap;src:url(fonts/readex-pro-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Readex";font-weight:500;font-display:swap;src:url(fonts/readex-pro-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Readex";font-weight:600;font-display:swap;src:url(fonts/readex-pro-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Readex";font-weight:700;font-display:swap;src:url(fonts/readex-pro-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}

:root{
  --bg:#F2F4F3; --card:#FFFFFF; --ink:#1B211D; --mute:#6B746E; --line:#E4E8E5;
  --accent:#024713; --accent-soft:#E5EFE7; --accent-ink:#FFFFFF;
  --tag:#FFE7A3; --tag-ink:#6A4B00; --red:#E0453A; --green:#1F9D55;
  --shadow:0 2px 10px rgba(20,30,24,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Readex",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:600px;margin:0 auto;padding-bottom:30px}
svg.i{width:20px;height:20px;flex:none}

/* ---------- head: cover + floating card ---------- */
.cover{position:relative;height:150px;overflow:hidden;background:linear-gradient(135deg,#0B5E22,#024713 55%,#01310D)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .pat{position:absolute;inset:0;opacity:.14;background-image:url("mark-light.svg");background-size:64px;background-repeat:space}
.langseg{position:absolute;top:14px;inset-inline-start:14px;display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.langseg button{padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mute)}
.langseg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.idcard{position:relative;margin:-62px 16px 0;background:var(--card);border-radius:22px;box-shadow:0 8px 28px rgba(20,30,24,.10);padding:14px;display:flex;gap:14px;align-items:center}
.idcard .logo{width:76px;height:76px;border-radius:18px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.idcard .logo img{width:50px;height:50px;object-fit:contain}
.idcard h1{margin:0;font-size:25px;font-weight:700;line-height:1.2}
.idcard p{margin:3px 0 0;color:var(--mute);font-size:14px}
.info{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}
.info::-webkit-scrollbar{display:none}
.info>*{flex:none;display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;white-space:nowrap}
.info .dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
.info .dot.on{background:var(--green)}
.info svg.i{width:16px;height:16px;color:var(--accent)}
.note{margin:10px 16px 0;color:var(--mute);font-size:13.5px}

/* ---------- announcements: plain, or "on fire" ---------- */
.ads{display:grid;gap:10px;margin:14px 16px 0}
.ad{border-radius:18px;padding:13px 16px;font-weight:700;font-size:16px;line-height:1.4;display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(2,71,19,.12)}
.ad.fire{position:relative;overflow:hidden;color:#fff;border:0;font-size:17.5px;text-shadow:0 1px 2px rgba(120,20,0,.45);
  background:linear-gradient(115deg,#FF3D00,#FF8A00,#FFC400,#FF6D00,#FF3D00);background-size:300% 100%;
  box-shadow:0 0 0 1px rgba(255,120,0,.35),0 6px 22px rgba(255,90,0,.45);animation:fireflow 3.2s linear infinite,fireglow 1.6s ease-in-out infinite alternate}
.ad.fire::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 12% 120%,rgba(255,255,255,.35),transparent 60%),radial-gradient(40% 90% at 88% -20%,rgba(255,240,180,.35),transparent 60%);pointer-events:none}
.ad .flame{font-size:24px;line-height:1;display:inline-block;transform-origin:50% 90%;animation:flicker .9s ease-in-out infinite alternate}
.ad span.tx{position:relative;z-index:1}
@keyframes fireflow{to{background-position:300% 0}}
@keyframes fireglow{from{box-shadow:0 0 0 1px rgba(255,120,0,.35),0 4px 14px rgba(255,90,0,.35)}to{box-shadow:0 0 0 1px rgba(255,160,0,.6),0 8px 30px rgba(255,80,0,.7)}}
@keyframes flicker{0%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(.96) rotate(-2deg)}}
@media (prefers-reduced-motion: reduce){.ad.fire,.ad .flame{animation:none}}

/* ---------- search + view switch ---------- */
.tools{display:flex;gap:10px;padding:14px 16px 4px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;height:50px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding-inline:46px 18px;box-shadow:var(--shadow)}
.search svg{position:absolute;top:15px;inset-inline-start:16px;color:var(--mute)}
.viewseg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.viewseg button{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.viewseg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ---------- category tabs ---------- */
.tabs{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:8px;padding-top:10px;border-bottom:1px solid var(--line)}
.tabs-in{flex:1;display:flex;gap:22px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs-in button{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:6px 0 12px;font-weight:600;font-size:15px;color:var(--mute);border-bottom:2.5px solid transparent}
.tabs-in button[aria-current="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .ico{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent)}
.tabs .ico img{width:100%;height:100%;object-fit:cover}
.tabs .all{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin-inline-end:12px;margin-bottom:8px;flex:none;box-shadow:0 4px 12px rgba(2,71,19,.25)}

/* ---------- sections ---------- */
.sec{padding:0 16px}
.sec-h{display:flex;align-items:center;gap:12px;width:100%;padding:22px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sec-h .ico{width:44px;height:44px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);font-weight:700}
.sec-h .ico img{width:100%;height:100%;object-fit:cover}
.sec-h h2{margin:0;font-size:21px;font-weight:700;flex:1;line-height:1.3}
.sec-h .chev{color:var(--mute);transition:transform .2s}
.sec.shut .chev{transform:rotate(180deg)}
.sec.shut .grid,.sec.shut .list,.sec.shut .deals{display:none}
.deals{display:grid;gap:8px;margin-bottom:12px}
.deal{background:var(--tag);color:var(--tag-ink);border-radius:16px;padding:12px 14px}
.deal b{display:block;font-weight:600}
.deal span{font-size:13px}

/* grid cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-align:start;width:100%}
.card .ph{aspect-ratio:1/1;background:#EEF1EF;position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph .plus{position:absolute;bottom:10px;inset-inline-end:10px;border:3px solid #fff}
.card .in{padding:12px 13px 13px;display:flex;flex-direction:column;flex:1;gap:4px}
.card b{font-weight:600;font-size:15px;line-height:1.35}
.card .d{color:var(--mute);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{display:flex;flex-direction:column;min-width:0}
.price .big{font-weight:700;font-size:16px;line-height:1.25;white-space:nowrap}
.price .small{color:var(--mute);font-size:11.5px;white-space:nowrap}
.price s{color:var(--mute);font-size:12px}
.price .from{font-size:11.5px;color:var(--mute);font-weight:400}
.plus{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 10px rgba(2,71,19,.25)}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--tag);color:var(--tag-ink);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.ph-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#B7C2BA}
.ph-empty svg{width:42%;height:42%}

/* list rows */
.list{display:grid;gap:10px}
.row{background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;gap:12px;padding:12px;text-align:start;width:100%;position:relative}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row b{font-weight:600;font-size:15.5px;line-height:1.35}
.row .d{color:var(--mute);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.row .ph{width:100px;height:100px;border-radius:14px;overflow:hidden;background:#EEF1EF;flex:none;position:relative}
.row .ph img{width:100%;height:100%;object-fit:cover}
.row .badge{top:6px;inset-inline-start:6px}

.empty{padding:50px 24px;text-align:center;color:var(--mute)}
.foot-note{padding:28px 18px 10px;color:var(--mute);font-size:12.5px;text-align:center}
.foot-note p{margin:3px 0}
.totop{position:fixed;bottom:18px;inset-inline-end:16px;z-index:7;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(2,71,19,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.totop.on{opacity:1;pointer-events:auto}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;inset-inline:0;bottom:0;margin:0 auto;max-width:600px;max-height:92vh;background:#fff;border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.on{transform:none}
.sheet:focus{outline:none}
.sheet .x{position:absolute;top:12px;inset-inline-end:12px;z-index:2;width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.sheet .body{overflow-y:auto;padding:0 18px 18px;overscroll-behavior:contain}
.sheet .hero{margin:0 -18px 6px;aspect-ratio:4/3;overflow:hidden;background:#EEF1EF}
.sheet .hero img{width:100%;height:100%;object-fit:cover}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px}
.sheet h2{margin:12px 0 2px;font-size:23px;font-weight:700;line-height:1.3;padding-inline-end:44px}
.sheet .p0{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sheet .p0 .big{font-weight:700;font-size:18px}
.sheet .p0 .small{color:var(--mute);font-size:13px}
.sheet .d{margin:6px 0 0;color:var(--mute)}
.parts{margin:12px 0 0;padding:0;list-style:none}
.parts li{padding:9px 0;border-bottom:1px dashed var(--line)}
.opt-g{margin:18px -18px 0;border:0;padding:0}
.opt-g legend{display:flex;width:100%;justify-content:space-between;align-items:center;background:#F4F6F5;padding:10px 18px;font-weight:600;font-size:15px}
.opt-g legend small{font-weight:500;color:var(--mute);font-size:12px;background:#fff;border-radius:999px;padding:2px 10px}
.opt-g .opts{padding:4px 18px 0}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.opt .n{flex:1}
.opt .p{color:var(--mute);font-size:13.5px}
.total{border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;background:#fff}
.total .lab{flex:1;color:var(--mute);font-size:12.5px;line-height:1.4}
.total .bar{background:var(--accent);color:#fff;border-radius:16px;padding:10px 16px;text-align:center;min-width:150px}
.total .bar .big{display:block;font-size:19px;font-weight:700;line-height:1.2}
.total .bar .small{font-size:12px;opacity:.85}
.total .bar s{display:block;font-size:12px;opacity:.75}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 0 4px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:16px;background:#F4F6F5;font-weight:600;font-size:13px;text-align:center;line-height:1.3}
.cats .ico{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:20px}
.cats .ico img{width:100%;height:100%;object-fit:cover}

@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion: reduce){.sheet,.scrim,.totop{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">…</div></div>
<button class="totop" id="totop" aria-label="Top"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden></div>

<script id="seed" type="application/json"></script>
<script>
(function(){
'use strict';
const TX = {

      choose:'Pick one', any:'Pick any', req:'Required', opt:'Optional', size:'Size', total:'Final price', info:'Prices for reference. Order at the counter.', close:'Close',
      loadErr:'The menu could not load. Check your connection and try again.', retry:'Try again', sections:'Categories', grid:'Grid', list:'List',

let M = null, lang = 'ar', q = '', open = null, layout = 'grid';

try { const s = localStorage.getItem('menu-lang'); if (s === 'en' || s === 'ar') lang = s; const v = localStorage.getItem('menu-view'); if (v === 'list' || v === 'grid') layout = v; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = (k, v) => { let r = TX[lang][k]; if (v) for (const x in v) r = r.split('{' + x + '}').join(v[x]); return r; };
const nm = o => (lang === 'en' && o.nameEn) ? o.nameEn : o.name;
const ds = o => (lang === 'en' && o.descEn) ? o.descEn : (lang === 'en' && o.nameEn ? '' : o.desc || '');
const sep = () => lang === 'en' ? ', ' : '، ';
const num = v => +v || 0;
const ceilTo = (v, s) => s > 0 ? Math.ceil(Math.round(v / s * 1e6) / 1e6) * s : v;
const r2 = v => Math.round(v * 100) / 100;
const usd = v => '$' + r2(v).toFixed(2);
const toLbp = p => ceilTo(p * num(M.rate), num(M.roundLbp));
const showL = () => M.showLbp !== false && num(M.rate) > 0;
const lbpTxt = v => lang === 'en' ? 'LBP ' + toLbp(v).toLocaleString('en-US') : toLbp(v).toLocaleString('en-US') + ' ' + t('lbp');
/* the big currency: Lebanese pounds unless the program says dollars */
const leadL = () => M.lead !== 'usd' && showL();
const money = v => leadL() ? lbpTxt(v) : usd(v);
const other = v => leadL() ? usd(v) : (showL() ? lbpTxt(v) : '');
const I = {
  search: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

  list: '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="5" height="4" rx="1.5"/><rect x="10" y="4.5" width="11" height="3" rx="1.5"/><rect x="3" y="10" width="5" height="4" rx="1.5"/><rect x="10" y="10.5" width="11" height="3" rx="1.5"/><rect x="3" y="16" width="5" height="4" rx="1.5"/><rect x="10" y="16.5" width="11" height="3" rx="1.5"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chev: '<svg class="i chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  pin: '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
  phone: '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>',
  plate: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="32" cy="32" r="15"/><circle cx="32" cy="32" r="9"/><path d="M10 14v14M6 14v8a4 4 0 0 0 8 0v-8M10 28v22M54 14c-4 3-5 9-5 15h5v21"/></svg>'
};

/* ---------- timed discounts: same rules as the till ---------- */
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function promoActive(p, d){
  if (!p || !(num(p.pct) > 0)) return false;
  const day = dayKey(d);
  if (p.dateFrom && day < p.dateFrom) return false;
  if (p.dateTo && day > p.dateTo) return false;
  if (Array.isArray(p.days) && p.days.length && !p.days.includes(d.getDay())) return false;
  if (p.from && p.to) { const tm = pad(d.getHours()) + ':' + pad(d.getMinutes()); if (p.from <= p.to ? !(tm >= p.from && tm < p.to) : !(tm >= p.from || tm < p.to)) return false; }
  return true;
}
function promoFor(it){
  if (it.combo) return null;
  let best = null; const now = new Date();
  for (const p of M.promos || []) {
    if (!promoActive(p, now)) continue;
    const hit = p.target === 'all' || (p.target === 'group' && (p.ids || []).includes(it.g)) || (p.target === 'item' && (p.ids || []).includes(it.id));
    if (hit && (!best || num(p.pct) > num(best.pct))) best = p;
  }
  return best;
}
const disc = (v, p) => p ? r2(v * (1 - num(p.pct) / 100)) : v;
function promoToday(p){
  const d = new Date(), day = dayKey(d);
  if (!p || !(num(p.pct) > 0)) return false;
  if (p.dateFrom && day < p.dateFrom) return false;
  if (p.dateTo && day > p.dateTo) return false;
  if (Array.isArray(p.days) && p.days.length && !p.days.includes(d.getDay())) return false;
  if (p.from && p.to && p.from <= p.to) { const tm = pad(d.getHours()) + ':' + pad(d.getMinutes()); if (tm >= p.to) return false; }
  return true;
}
function dealHTML(p){
  const target = p.target === 'all' ? t('all') : (p.ids || []).map(id => { const o = p.target === 'group' ? M.groups.find(g => g.id === id) : M.items.find(i => i.id === id); return o ? nm(o) : ''; }).filter(Boolean).join(sep());
  const when = [];
  if (p.from && p.to && !(p.from === '00:00' && p.to >= '23:59')) when.push(t('between', {a: `<span class="num">${esc(p.from)}</span>`, b: `<span class="num">${esc(p.to)}</span>`}));
  if (Array.isArray(p.days) && p.days.length && p.days.length < 7) when.push(p.days.slice().sort().map(x => TX[lang].days[x]).join(sep()));
  if (p.dateTo) when.push(t('until', {d: `<span class="num">${esc(p.dateTo)}</span>`}));
  return `<div class="deal"><b>${t('off', {p: `<span class="num">${num(p.pct)}</span>`})} ${t('on')} ${esc(target)}</b>${when.length ? `<span>${when.join(sep())}</span>` : ''}</div>`;
}

/* ---------- opening hours ---------- */
function hoursChip(){
  const a = M.hoursFrom, b = M.hoursTo; if (!a || !b) return '';
  const d = new Date(), now = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const isOpen = a <= b ? (now >= a && now < b) : (now >= a || now < b);
  const fmt = x => `<span class="num">${esc(x === '24:00' ? '00:00' : x)}</span>`;
  return `<span><i class="dot ${isOpen ? 'on' : ''}"></i>${isOpen ? t('open', {t: fmt(b)}) : t('closed', {t: fmt(a)})}</span>`;
}

/* ---------- items ---------- */
function facts(it){
  const pr = promoFor(it), min = Math.min(...it.sizes.map(s => num(s.price)));
  const many = it.sizes.length > 1;
  const d = it.combo ? it.combo.parts.map(p => (lang === 'en' && p.nameEn ? p.nameEn : p.name) + (p.qty > 1 ? ' ×' + p.qty : '')).join(' + ') : ds(it);
  const now = disc(min, pr);
  const was = it.combo && num(it.combo.regular) > min ? num(it.combo.regular) : (pr ? min : 0);
  return {pr, many, d, now, was, img: it.img || ''};
}
const priceHTML = f => `<span class="price">${f.was ? `<s class="num">${money(f.was)}</s>` : ''}<span class="big">${f.many ? `<span class="from">${t('from')}</span> ` : ''}<span class="num">${money(f.now)}</span></span>${other(f.now) ? `<span class="small num">${other(f.now)}</span>` : ''}</span>`;
const photo = f => (f.img ? `<img src="${esc(f.img)}" alt="" loading="lazy">` : `<span class="ph-empty">${I.plate}</span>`) + (f.pr ? `<span class="badge num">−${num(f.pr.pct)}%</span>` : '');
function cardHTML(it){
  const f = facts(it);
  return `<button class="card" data-it="${esc(it.id)}"><span class="ph">${photo(f)}<span class="plus" aria-hidden="true">${I.plus}</span></span><span class="in"><b>${esc(nm(it))}</b>${f.d ? `<span class="d">${esc(f.d)}</span>` : ''}
    <span class="foot">${priceHTML(f)}</span></span></button>`;
}
function rowHTML(it){
  const f = facts(it);
  return `<button class="row" data-it="${esc(it.id)}"><span class="t"><b>${esc(nm(it))}</b>${f.d ? `<span class="d">${esc(f.d)}</span>` : ''}
    <span class="foot">${priceHTML(f)}<span class="plus" aria-hidden="true">${I.plus}</span></span></span><span class="ph">${photo(f)}</span></button>`;
}
const itemsHTML = list => layout === 'list' ? `<div class="list">${list.map(rowHTML).join('')}</div>` : `<div class="grid">${list.map(cardHTML).join('')}</div>`;
const groupIco = g => g.img ? `<img src="${esc(g.img)}" alt="">` : esc((nm(g) || '?').trim().charAt(0));
const match = it => { if (!q) return true; const s = q.toLowerCase(); return [it.name, it.nameEn, it.desc, it.descEn].some(x => x && String(x).toLowerCase().includes(s)); };
function model(){
  const items = M.items.filter(match);
  const combos = items.filter(i => i.combo);
  const deals = q ? [] : (M.promos || []).filter(promoToday);
  const groups = M.groups.map(g => ({g, list: items.filter(i => !i.combo && i.g === g.id)})).filter(x => x.list.length);
  const loose = items.filter(i => !i.combo && !M.groups.some(g => g.id === i.g));
  if (loose.length) groups.push({g: {id: '_', name: 'أصناف أخرى', nameEn: 'More'}, list: loose});
  return {items, combos, deals, groups, hasOffers: combos.length > 0 || deals.length > 0};
}
const title = () => (lang === 'en' && M.nameEn ? M.nameEn : M.name) || 'Groots Cup';
const sub = () => (lang === 'en' && M.subtitleEn ? M.subtitleEn : M.subtitle) || '';
function fmtDate(s){ const d = new Date(s); return isNaN(d) ? '' : `${dayKey(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

function render(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.title = title();
  const m = model();
  const note = lang === 'en' && M.noteEn ? M.noteEn : M.note;
  const addr = lang === 'en' && M.addressEn ? M.addressEn : M.address;
  const info = [hoursChip(),
    addr ? (M.mapsUrl ? `<a href="${esc(M.mapsUrl)}" target="_blank" rel="noopener">${I.pin}${esc(addr)}</a>` : `<span>${I.pin}${esc(addr)}</span>`) : '',
    M.phone ? `<a href="tel:${esc(String(M.phone).replace(/[^\d+]/g, ''))}">${I.phone}<span class="num">${esc(M.phone)}</span></a>` : ''].filter(Boolean).join('');
  const sections = [];
  if (m.hasOffers) sections.push({id: 'offers', name: t('offers'), ico: '%', html: `${m.deals.length ? `<div class="deals">${m.deals.map(dealHTML).join('')}</div>` : ''}${m.combos.length ? itemsHTML(m.combos) : ''}`});
  m.groups.forEach(x => sections.push({id: 'g-' + x.g.id, name: nm(x.g), icoHTML: groupIco(x.g), html: itemsHTML(x.list)}));
  $('#app').innerHTML = `
    <header class="cover">${M.cover ? `<img src="${esc(M.cover)}" alt="">` : `<div class="pat"></div>`}
      <div class="langseg" role="group"><button data-lang="en" aria-pressed="${lang === 'en'}">EN</button><button data-lang="ar" aria-pressed="${lang === 'ar'}">عربي</button></div></header>
    <section class="idcard">${M.logo !== false ? `<div class="logo"><img src="mark.svg" alt=""></div>` : ''}<div><h1>${esc(title())}</h1>${sub() ? `<p>${esc(sub())}</p>` : ''}</div></section>
    ${info ? `<div class="info">${info}</div>` : ''}
    ${note ? `<p class="note">${esc(note)}</p>` : ''}
    ${(M.ads || []).length ? `<div class="ads">${M.ads.map(a => `<div class="ad ${a.fire ? 'fire' : ''}">${a.fire ? '<span class="flame" aria-hidden="true">🔥</span>' : ''}<span class="tx">${esc(lang === 'en' && a.textEn ? a.textEn : a.text)}</span></div>`).join('')}</div>` : ''}
    <div class="tools"><label class="search">${I.search}<input id="q" type="search" value="${esc(q)}" placeholder="${t('search')}" aria-label="${t('search')}"></label>
      <div class="viewseg" role="group"><button data-layout="grid" aria-pressed="${layout === 'grid'}" aria-label="${t('grid')}">${I.grid}</button><button data-layout="list" aria-pressed="${layout === 'list'}" aria-label="${t('list')}">${I.list}</button></div></div>
    ${sections.length && !q ? `<nav class="tabs"><div class="tabs-in" data-rail>${sections.map(s => `<button data-go="${esc(s.id)}"><span class="ico">${s.icoHTML || esc(s.ico)}</span>${esc(s.name)}</button>`).join('')}</div>
      <button class="all" id="allcats" aria-label="${t('sections')}">${I.grid}</button></nav>` : ''}
    <main>${sections.map(s => `<section class="sec ${shut.has(s.id) ? 'shut' : ''}" id="${esc(s.id)}"><button class="sec-h" data-shut="${esc(s.id)}" aria-expanded="${!shut.has(s.id)}"><span class="ico">${s.icoHTML || esc(s.ico)}</span><h2>${esc(s.name)}</h2>${I.chev}</button>${s.html}</section>`).join('')}
      ${!m.items.length ? `<div class="empty">${t('none')}</div>` : ''}</main>
    <footer class="foot-note">${showL() ? `<p>${t('rate', {r: `<span class="num">${num(M.rate).toLocaleString('en-US')}</span>`})}</p>` : ''}${M.updatedAt ? `<p>${t('updated')}: <span class="num">${esc(fmtDate(M.updatedAt))}</span></p>` : ''}</footer>`;
  spy();
}

/* highlight the tab of the section on screen */
let io = null;
function setCurrent(id){
  const rail = document.querySelector('[data-rail]'); if (!rail) return;
  const tabs = [...rail.querySelectorAll('[data-go]')];
  tabs.forEach(c => c.setAttribute('aria-current', c.dataset.go === id ? 'true' : 'false'));
  const on = tabs.find(c => c.dataset.go === id);
  // scroll the rail only; scrollIntoView would cancel the page's own smooth scroll
  if (on) { const a = on.getBoundingClientRect(), b = rail.getBoundingClientRect(); rail.scrollBy({left: (a.left + a.width / 2) - (b.left + b.width / 2), behavior: 'smooth'}); }
}
function spy(){
  if (io) io.disconnect();
  if (!document.querySelector('[data-rail]') || !('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(es => { const v = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0]; if (v) setCurrent(v.target.id); }, {rootMargin: '-120px 0px -60% 0px'});
  document.querySelectorAll('main > section').forEach(s => io.observe(s));
  const first = document.querySelector('main > section'); if (first) setCurrent(first.id);
}
window.addEventListener('scroll', () => {
  $('#totop').classList.toggle('on', window.scrollY > 700);
  if (window.innerHeight + window.scrollY < document.documentElement.scrollHeight - 4) return;
  const secs = document.querySelectorAll('main > section'); if (secs.length) setCurrent(secs[secs.length - 1].id);
}, {passive: true});

/* ---------- sheets: item and all categories ---------- */
function showSheet(html, after){
  const sh = $('#sheet'); sh.hidden = false; sh.innerHTML = html; if (after) after();
  requestAnimationFrame(() => { sh.classList.add('on'); $('#scrim').classList.add('on'); });
  document.body.style.overflow = 'hidden'; sh.tabIndex = -1; sh.focus({preventScroll: true});
}
function itemSheet(){
  const it = open.it, f = facts(it);
  const mgs = (it.mods || []).map(id => M.mods.find(m => m.id === id)).filter(Boolean);
  const sz = it.sizes.length > 1 ? `<fieldset class="opt-g"><legend>${t('size')}<small>${t('req')}</small></legend><div class="opts">${it.sizes.map((s, i) => `<label class="opt"><input type="radio" name="sz" value="${i}" ${i === open.size ? 'checked' : ''}><span class="n">${esc(nm(s))}</span><span class="p num">${money(disc(num(s.price), f.pr))}</span></label>`).join('')}</div></fieldset>` : '';
  return `<button class="x" data-close aria-label="${t('close')}">${I.x}</button>
    <div class="body">
      ${f.img ? `<div class="hero"><img src="${esc(f.img)}" alt=""></div>` : `<div class="grab"></div>`}
      <h2 id="sh-title">${esc(nm(it))}</h2>
      <div class="p0">${f.was ? `<s class="num" style="color:var(--mute)">${money(f.was)}</s>` : ''}<span class="big num">${money(f.now)}</span>${other(f.now) ? `<span class="small num">${other(f.now)}</span>` : ''}${f.pr ? `<span class="badge num" style="position:static">−${num(f.pr.pct)}%</span>` : ''}</div>
      ${f.d && !it.combo ? `<p class="d">${esc(f.d)}</p>` : ''}
      ${it.combo ? `<ul class="parts">${it.combo.parts.map(p => { const s = lang === 'en' ? p.sizeEn || p.size : p.size; return `<li>${esc(lang === 'en' && p.nameEn ? p.nameEn : p.name)}${s ? ` <small>(${esc(s)})</small>` : ''}${p.qty > 1 ? ` <span class="num">×${p.qty}</span>` : ''}</li>`; }).join('')}</ul>` : ''}
      ${sz}
      ${mgs.map(g => `<fieldset class="opt-g"><legend>${esc(nm(g))}<small>${g.min ? t('req') : t('opt')}${sep()}${g.max === 1 ? t('choose') : t('any')}</small></legend><div class="opts">
        ${g.options.map(o => `<label class="opt"><input type="${g.max === 1 ? 'radio' : 'checkbox'}" name="m-${esc(g.id)}" value="${esc(o.id)}" data-g="${esc(g.id)}" ${(open.sel[g.id] || []).includes(o.id) ? 'checked' : ''}><span class="n">${esc(nm(o))}</span>${num(o.price) ? `<span class="p num">+${money(o.price)}</span>` : ''}</label>`).join('')}</div></fieldset>`).join('')}
    </div>
    <div class="total" id="tot"></div>`;
}
function calcTotal(){
  const it = open.it, pr = promoFor(it), sz = it.sizes[open.size] || it.sizes[0];
  let raw = num(sz.price);
  for (const g of (it.mods || []).map(id => M.mods.find(m => m.id === id)).filter(Boolean)) for (const id of open.sel[g.id] || []) { const o = g.options.find(x => x.id === id); if (o) raw += num(o.price); }
  raw = r2(raw);
  const v = disc(raw, pr);
  const was = it.combo && num(it.combo.regular) > v ? it.combo.regular : (pr ? raw : 0);
  $('#tot').innerHTML = `<div class="lab"><b style="color:var(--ink);display:block;font-size:14px">${t('total')}</b>${t('info')}</div><div class="bar">${was ? `<s class="num">${money(was)}</s>` : ''}<span class="big num">${money(v)}</span>${other(v) ? `<span class="small num">${other(v)}</span>` : ''}</div>`;
}
function openItem(id){
  const it = M.items.find(i => i.id === id); if (!it) return;
  const sel = {};
  (it.mods || []).forEach(gid => { const g = M.mods.find(m => m.id === gid); if (g && g.min && g.max === 1 && g.options[0]) sel[g.id] = [g.options[0].id]; });
  open = {it, size: 0, sel, from: document.activeElement};
  showSheet(itemSheet(), calcTotal);
}
function openCats(){
  const m = model();
  const list = [...(m.hasOffers ? [{id: 'offers', name: t('offers'), ico: '%'}] : []), ...m.groups.map(x => ({id: 'g-' + x.g.id, name: nm(x.g), icoHTML: groupIco(x.g)}))];
  open = {cats: true, from: document.activeElement};
  showSheet(`<button class="x" data-close aria-label="${t('close')}">${I.x}</button><div class="body"><div class="grab"></div><h2 id="sh-title">${t('sections')}</h2>
    <div class="cats">${list.map(s => `<button data-gocat="${esc(s.id)}"><span class="ico">${s.icoHTML || esc(s.ico)}</span>${esc(s.name)}</button>`).join('')}</div></div>`);
}
function closeSheet(){
  if (!open) return;
  const sh = $('#sheet'), from = open.from; open = null;
  sh.classList.remove('on'); $('#scrim').classList.remove('on'); document.body.style.overflow = '';
  setTimeout(() => { if (!open) { sh.hidden = true; sh.innerHTML = ''; } }, 280);
  if (from && from.focus) from.focus({preventScroll: true});
}
const go = id => { const s = document.getElementById(id); if (s) s.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); };

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const r = e.target.closest('[data-it]'); if (r) return openItem(r.dataset.it);
  if (e.target.closest('[data-close]') || e.target.id === 'scrim') return closeSheet();
  const gc = e.target.closest('[data-gocat]'); if (gc) { const id = gc.dataset.gocat; closeSheet(); setTimeout(() => go(id), 60); return; }
  const c = e.target.closest('[data-go]'); if (c) return go(c.dataset.go);
  const sh = e.target.closest('[data-shut]'); if (sh) { const id = sh.dataset.shut; shut.has(id) ? shut.delete(id) : shut.add(id); const s = document.getElementById(id); s.classList.toggle('shut', shut.has(id)); sh.setAttribute('aria-expanded', !shut.has(id)); return; }
  const lb = e.target.closest('[data-lang]'); if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('menu-lang', lang); } catch (x) {} render(); return; }
  const lv = e.target.closest('[data-layout]'); if (lv) { layout = lv.dataset.layout; try { localStorage.setItem('menu-view', layout); } catch (x) {} const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (e.target.closest('#allcats')) return openCats();
  if (e.target.closest('#totop')) window.scrollTo({top: 0, behavior: 'smooth'});
});
document.addEventListener('change', e => {
  if (!open || !open.it) return;
  const el = e.target;
  if (el.name === 'sz') { open.size = +el.value; return calcTotal(); }
  if (el.dataset.g) { open.sel[el.dataset.g] = [...document.querySelectorAll(`[data-g="${CSS.escape(el.dataset.g)}"]:checked`)].map(x => x.value); calcTotal(); }
});
/* a single-choice group that is not required can be cleared by tapping the picked option again */
document.addEventListener('pointerdown', e => {
  const lab = e.target.closest('.opt'); if (!lab || !open || !open.it) return;
  const inp = lab.querySelector('input[type=radio][data-g]'); if (!inp) return;
  const g = M.mods.find(m => m.id === inp.dataset.g);
  if (g && !g.min && inp.checked) inp.dataset.unpick = '1';
});
document.addEventListener('click', e => {
  const inp = e.target.closest('input[data-unpick]'); if (!inp) return;
  delete inp.dataset.unpick; inp.checked = false; open.sel[inp.dataset.g] = []; calcTotal();
}, true);
let qt;
document.addEventListener('input', e => { if (e.target.id !== 'q') return; clearTimeout(qt); qt = setTimeout(() => { q = e.target.value.trim(); const pos = e.target.selectionStart; render(); const n = $('#q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }, 200); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- load ---------- */
async function load(){
  const seed = $('#seed').textContent.trim();
  try {
    M = seed ? JSON.parse(seed) : await (await fetch('menu.json?t=' + Date.now(), {cache: 'no-store'})).json();
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="empty"><p>${t('loadErr')}</p><button onclick="location.reload()" style="color:var(--accent);font-weight:600">${t('retry')}</button></div>`;
  }
}
/* when the phone comes back to the page, pick up new prices */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && M && !open && !$('#seed').textContent.trim()) fetch('menu.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json()).then(d => { if (d.updatedAt !== M.updatedAt) { M = d; render(); } }).catch(() => {}); });
window.__menu = {go: id => go(id.startsWith('g-') || id === 'offers' ? id : 'g-' + id), setStyle: () => {}, layout: v => { layout = v; render(); }};
load();
})();
</script>
